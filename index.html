<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyMOD</title>
    <style>
        :root {
            --bg-glass: rgba(255, 255, 255, 0.15);
            --bg-glass-hover: rgba(255, 255, 255, 0.25);
            --border-glass: rgba(255, 255, 255, 0.2);
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Times New Roman', Times, serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
        }

        .shell {
            width: 100%;
            max-width: 900px;
            height: 95vh;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #06b6d4 100%);
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            margin: 20px;
        }

        @media (max-width: 768px) {
            .shell {
                height: 100vh;
                border-radius: 0;
                margin: 0;
            }
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            pointer-events: none;
            z-index: 0;
        }

        .blob-1 { width: 350px; height: 350px; background: #60a5fa; top: -100px; left: -100px; }
        .blob-2 { width: 400px; height: 400px; background: #93c5fd; bottom: -100px; right: -100px; }
        .blob-3 { width: 250px; height: 250px; background: #0284c7; top: 40%; left: 30%; }

        .content {
            position: relative;
            z-index: 1;
            padding: 30px;
            height: 100%;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.3) transparent;
        }

        .content::-webkit-scrollbar {
            width: 6px;
        }
        .content::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
        }

        .header {
            text-align: center;
            padding: 20px 10px 40px;
            animation: fadeDown 0.7s ease both;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.18);
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(12px);
            border-radius: 999px;
            padding: 7px 18px 7px 10px;
            margin-bottom: 22px;
        }

        .logo-icon {
            width: 28px; height: 28px;
            background: white;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
            font-weight: 900;
            color: #1e3a8a;
        }

        .logo-text {
            font-size: 15px;
            font-weight: 800;
            color: white;
            letter-spacing: -0.3px;
        }

        .header h1 {
            font-size: 38px;
            font-family: 'Times New Roman', Times, serif;
            font-weight: 900;
            color: white;
            line-height: 1.1;
            letter-spacing: -1px;
            margin-bottom: 20px;
            text-shadow: 0 2px 20px rgba(0,0,0,0.2);
        }

        .header-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-glass {
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            color: white;
            padding: 12px 24px;
            font-size: 14px;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 800;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            font-family: inherit;
        }

        .btn-glass:hover:not(:disabled) {
            background: var(--bg-glass-hover);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .btn-glass:active:not(:disabled) {
            transform: scale(0.96);
        }

        .btn-glass:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-primary {
            background: white;
            color: #1e3a8a;
            border: none;
        }

        .btn-primary:hover:not(:disabled) {
            background: #f8fafc;
        }

        .card {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            animation: fadeUp 0.6s ease both;
        }

        /* Start screen */
        .section-label {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-sub);
            margin-bottom: 12px;
            padding-left: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-box {
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border-glass);
            border-radius: 18px;
            padding: 16px;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-sub);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .stat-val {
            font-size: 28px;
            font-weight: 900;
        }

        /* Chart */
        .chart-container {
            margin-bottom: 24px;
        }

        .chart-bar-wrapper {
            margin-bottom: 12px;
        }

        .chart-label-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .bar-bg {
            height: 12px;
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .bar-fill {
            height: 100%;
            background: white;
            border-radius: 6px;
            transition: width 0.8s ease-out;
        }

        /* Exam Screen */
        .progress-wrapper {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .progress-text {
            font-size: 14px;
            font-weight: 800;
            min-width: 60px;
        }

        .progress-track {
            flex-grow: 1;
            height: 8px;
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: white;
            transition: width 0.3s ease;
        }

        .question-category {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }

        .question-text {
            font-size: 20px;
            font-weight: 800;
            line-height: 1.4;
            margin-bottom: 24px;
        }

        .option {
            background: rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: all 0.2s;
            font-weight: 600;
            font-size: 15px;
        }

        .option:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.3);
        }

        .option.selected {
            background: rgba(255,255,255,0.9);
            color: #1e3a8a;
            border-color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .option-marker {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            font-weight: 800;
            color: white;
        }

        .option.selected .option-marker {
            background: #1e3a8a;
        }

        .exam-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 24px;
        }

        /* Results Screen */
        .score-display {
            text-align: center;
            margin: 20px 0 40px;
        }

        .score-value {
            font-size: 72px;
            font-family: 'Times New Roman', Times, serif;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 10px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .pass-fail {
            display: inline-block;
            padding: 8px 24px;
            border-radius: 999px;
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .pass-tag {
            background: rgba(52, 211, 153, 0.2);
            color: #6ee7b7;
            border: 1px solid rgba(52, 211, 153, 0.4);
        }

        .fail-tag {
            background: rgba(248, 113, 113, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(248, 113, 113, 0.4);
        }

        .review-item {
            background: rgba(0,0,0,0.15);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .review-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .review-status {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .status-correct {
            background: rgba(52, 211, 153, 0.2);
            color: #6ee7b7;
        }

        .status-wrong {
            background: rgba(248, 113, 113, 0.2);
            color: #fca5a5;
        }

        .review-question-text {
            font-weight: 700;
            margin-bottom: 16px;
            font-size: 15px;
        }

        .review-explanation {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
            border-left: 4px solid #60a5fa;
            margin-top: 12px;
        }

        .hidden {
            display: none !important;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #0f172a;
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            transform: translateY(20px);
            transition: transform 0.3s;
        }

        .modal-overlay.show .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 800;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 28px;
            cursor: pointer;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            border-radius: 5px;
        }

        .close-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        .code-block {
            background: rgba(0,0,0,0.3);
            padding: 16px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 12px;
            color: #93c5fd;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        input[type="file"] {
            display: none;
        }

        /* Animations */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .anim-1 { animation-delay: 0.1s; }
        .anim-2 { animation-delay: 0.2s; }
        .anim-3 { animation-delay: 0.3s; }

    </style>
</head>
<body>

<div class="shell">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="content">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">S</div>
                <span class="logo-text">StudyMOD</span>
            </div>
            <h1>Certification<br>Practice</h1>
            <div class="header-actions">
                <label for="fileInput" class="btn-glass" style="cursor:pointer;">Import</label>
                <input type="file" id="fileInput" accept=".txt" style="display:none;">
                <button class="btn-glass" id="downloadBtn">Download Files</button>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="startScreen">
            <div class="card anim-1">
                <h2 id="questionSetTitle" style="font-size: 24px; font-weight: 900; margin-bottom: 8px;">Welcome to Practice Exam</h2>
                <p id="questionSetInfo" style="color: var(--text-sub); font-weight: 600; margin-bottom: 24px;">Please import a question set to begin</p>
                
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-label">Total Attempts</div>
                        <div class="stat-val" id="totalAttempts">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Average Score</div>
                        <div class="stat-val" id="avgScore">0%</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Best Score</div>
                        <div class="stat-val" id="bestScore">0%</div>
                    </div>
                </div>

                <div id="chartSection" class="chart-container hidden">
                    <div class="section-label" style="padding-left:0; margin-bottom:16px;">Performance by Domain</div>
                    <div id="domainChart"></div>
                </div>

                <button class="btn-glass btn-primary" id="startExamBtn" style="width: 100%; font-size: 16px; padding: 16px;" disabled>Start Exam (15 Questions)</button>
            </div>
        </div>

        <!-- Exam Screen -->
        <div id="examScreen" class="hidden">
            <div class="card anim-1">
                <div class="progress-wrapper">
                    <div class="progress-text" id="progressText">1 / 15</div>
                    <div class="progress-track">
                        <div class="progress-bar" id="progressFill" style="width: 0%"></div>
                    </div>
                </div>

                <div id="questionContainer"></div>

                <div class="exam-nav">
                    <button class="btn-glass" id="prevBtn" disabled>Previous</button>
                    <button class="btn-glass" id="nextBtn">Next</button>
                    <button class="btn-glass btn-primary" id="submitBtn" style="display:none;">Submit</button>
                </div>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="resultsScreen" class="hidden">
            <div class="card anim-1" style="text-align: center;">
                <h2 style="font-size: 24px; font-weight: 900;">Exam Results</h2>
                
                <div class="score-display">
                    <div class="score-value" id="finalScore">0%</div>
                    <div id="passFail" class="pass-fail"></div>
                </div>

                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-label">Correct</div>
                        <div class="stat-val" id="correctCount" style="color: #6ee7b7;">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Incorrect</div>
                        <div class="stat-val" id="incorrectCount" style="color: #fca5a5;">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Required</div>
                        <div class="stat-val" id="requiredPassRate">70%</div>
                    </div>
                </div>

                <button class="btn-glass btn-primary" id="restartBtn" style="margin-top: 10px; width: 100%;">Return to Start</button>
            </div>

            <div class="section-label anim-2">Review Your Answers</div>
            <div id="reviewContainer" class="anim-3"></div>
        </div>

    </div>
</div>


<script>
    let currentQuestionSet = null;
    let currentExam = [];
    let currentQuestionIndex = 0;
    let userAnswers = [];
    let examHistory = [];

    function openImportModal() {
        document.getElementById('importModal').classList.add('show');
    }

    function closeImportModal() {
        document.getElementById('importModal').classList.remove('show');
    }

    function handleFileImport(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const content = e.target.result;
            parseQuestionSet(content);
            closeImportModal();
        };
        reader.readAsText(file);
    }

    function parseQuestionSet(content) {
        const lines = content.split('\n').map(l => l.trim()).filter(l => l);
        if (lines.length < 2) {
            alert('Invalid file format');
            return;
        }

        const passes = lines[0].split(',');
        const title = passes[0] ? passes[0].trim() : 'Practice Exam';
        const setName = passes[1] ? passes[1].trim() : 'Questions';
        const passRateRaw = passes[2] ? passes[2].trim() : '70';

        const passRate = parseInt(passRateRaw) || 70;

        const questionSet = { 
            title, 
            setName, 
            passRate, 
            questions: [] 
        };

        for (let i = 1; i < lines.length; i++) {
            const parts = lines[i].split(',').map(p => p.trim());
            if (parts.length < 7) continue;

            questionSet.questions.push({
                question: parts[0],
                options: [parts[1], parts[2], parts[3], parts[4]],
                correct: 0,
                explanation: parts[5],
                category: parts[6]
            });
        }

        if (questionSet.questions.length === 0) {
            alert('No valid questions found in file');
            return;
        }

        loadQuestionSet(questionSet);
    }

    function loadQuestionSet(questionSet) {
        currentQuestionSet = questionSet;
        examHistory = [];
        
        document.getElementById('questionSetTitle').textContent = questionSet.title;
        document.getElementById('questionSetInfo').textContent = `${questionSet.setName} • ${questionSet.questions.length} questions available`;
        document.getElementById('startExamBtn').disabled = false;
        
        updateStatsDisplay();
    }

    function updateStatsDisplay() {
        const totalAttempts = examHistory.length;
        const avgScore = totalAttempts > 0 
            ? Math.round(examHistory.reduce((sum, exam) => sum + exam.score, 0) / totalAttempts)
            : 0;
        const bestScore = totalAttempts > 0
            ? Math.max(...examHistory.map(exam => exam.score))
            : 0;

        document.getElementById('totalAttempts').textContent = totalAttempts;
        document.getElementById('avgScore').textContent = avgScore + '%';
        document.getElementById('bestScore').textContent = bestScore + '%';

        if (totalAttempts > 0) {
            document.getElementById('chartSection').classList.remove('hidden');
            updateDomainChart();
        } else {
            document.getElementById('chartSection').classList.add('hidden');
        }
    }

    function updateDomainChart() {
        const domains = {};
        
        examHistory.forEach(exam => {
            exam.results.forEach(result => {
                if (!domains[result.category]) {
                    domains[result.category] = { correct: 0, total: 0 };
                }
                domains[result.category].total++;
                if (result.isCorrect) {
                    domains[result.category].correct++;
                }
            });
        });

        const chartHTML = Object.keys(domains).sort().map(domain => {
            const percentage = Math.round((domains[domain].correct / domains[domain].total) * 100);
            return \`
                <div class="chart-bar-wrapper">
                    <div class="chart-label-row">
                        <span>\${domain}</span>
                        <span>\${percentage}%</span>
                    </div>
                    <div class="bar-bg">
                        <div class="bar-fill" style="width: \${percentage}%"></div>
                    </div>
                </div>
            \`;
        }).join('');

        document.getElementById('domainChart').innerHTML = chartHTML;
    }

    function startExam() {
        if (!currentQuestionSet || currentQuestionSet.questions.length < 15) {
            alert('Not enough questions available. Need at least 15 questions.');
            return;
        }

        const shuffledQuestions = [...currentQuestionSet.questions].sort(() => Math.random() - 0.5);
        currentExam = shuffledQuestions.slice(0, 15).map(q => {
            const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
            const correctIndex = shuffledOptions.indexOf(q.options[q.correct]);
            return { ...q, options: shuffledOptions, correct: correctIndex };
        });

        currentQuestionIndex = 0;
        userAnswers = new Array(15).fill(null);

        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('examScreen').classList.remove('hidden');
        document.getElementById('resultsScreen').classList.add('hidden');

        displayQuestion();
    }

    function displayQuestion() {
        const question = currentExam[currentQuestionIndex];
        const letters = ['A', 'B', 'C', 'D'];
        
        const optionsHTML = question.options.map((option, index) => `
            <div class="option ${userAnswers[currentQuestionIndex] === index ? 'selected' : ''}" 
                 data-index="${index}">
                <div class="option-marker">${letters[index]}</div>
                <div>${option}</div>
            </div>
        `).join('');

        const questionHTML = `
            <div>
                <div class="question-category">${question.category}</div>
                <div class="question-text">${question.question}</div>
                <div id="optionsContainer">${optionsHTML}</div>
            </div>
        `;

        document.getElementById('questionContainer').innerHTML = questionHTML;

        document.getElementById('optionsContainer').addEventListener('click', function (e) {
            const opt = e.target.closest('[data-index]');
            if (opt) selectOption(parseInt(opt.dataset.index));
        });

        updateNavigation();
        updateProgress();
    }

    function selectOption(optionIndex) {
        userAnswers[currentQuestionIndex] = optionIndex;
        displayQuestion();
    }

    function updateNavigation() {
        document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;
        
        if (currentQuestionIndex === currentExam.length - 1) {
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('submitBtn').style.display = 'inline-block';
        } else {
            document.getElementById('nextBtn').style.display = 'inline-block';
            document.getElementById('submitBtn').style.display = 'none';
        }
    }

    function updateProgress() {
        const current = currentQuestionIndex + 1;
        const total = currentExam.length;
        document.getElementById('progressText').textContent = \`\${current} / \${total}\`;
        
        const progress = (current / total) * 100;
        document.getElementById('progressFill').style.width = progress + '%';
    }

    function previousQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            displayQuestion();
        }
    }

    function nextQuestion() {
        if (currentQuestionIndex < currentExam.length - 1) {
            currentQuestionIndex++;
            displayQuestion();
        }
    }

    function submitExam() {
        const unanswered = userAnswers.filter(a => a === null).length;
        if (unanswered > 0) {
            if (!confirm(\`You have \${unanswered} unanswered question(s). Submit anyway?\`)) {
                return;
            }
        }

        const results = currentExam.map((question, index) => ({
            question: question.question,
            category: question.category,
            options: question.options,
            correctAnswer: question.correct,
            userAnswer: userAnswers[index],
            isCorrect: userAnswers[index] === question.correct,
            explanation: question.explanation
        }));

        const correctCount = results.filter(r => r.isCorrect).length;
        const score = Math.round((correctCount / currentExam.length) * 100);
        const passed = score >= currentQuestionSet.passRate;

        examHistory.push({
            date: new Date().toISOString(),
            score: score,
            results: results
        });

        displayResults(score, correctCount, passed, results);
    }

    function displayResults(score, correctCount, passed, results) {
        document.getElementById('examScreen').classList.add('hidden');
        document.getElementById('resultsScreen').classList.remove('hidden');

        document.getElementById('finalScore').textContent = score + '%';
        document.getElementById('correctCount').textContent = correctCount;
        document.getElementById('incorrectCount').textContent = currentExam.length - correctCount;
        
        const passFailEl = document.getElementById('passFail');
        if (passed) {
            passFailEl.textContent = 'Passed';
            passFailEl.className = 'pass-fail pass-tag';
        } else {
            passFailEl.textContent = 'Failed';
            passFailEl.className = 'pass-fail fail-tag';
        }
        
        const reviewHTML = results.map((result, index) => {
            const hasAnswered = result.userAnswer !== null;
            const userAnswerText = hasAnswered ? result.options[result.userAnswer] : 'No answer';
            const correctAnswerText = result.options[result.correctAnswer];
            
            return \`
                <div class="review-item">
                    <div class="review-header">
                        <span style="font-weight: 800; color: var(--text-sub);">Q\${index + 1}</span>
                        <div class="review-status \${result.isCorrect ? 'status-correct' : 'status-wrong'}">
                            \${result.isCorrect ? 'Correct' : 'Incorrect'}
                        </div>
                    </div>
                    <div class="review-question-text">\${result.question}</div>
                    
                    <div style="font-size: 14px; margin-bottom: 8px;">
                        <span style="color: var(--text-sub);">Your Answer:</span>
                        <span style="font-weight: 700; color: \${result.isCorrect ? '#6ee7b7' : '#fca5a5'};">\${userAnswerText}</span>
                    </div>
                    
                    \${!result.isCorrect ? \`
                    <div style="font-size: 14px; margin-bottom: 8px;">
                        <span style="color: var(--text-sub);">Correct Answer:</span>
                        <span style="font-weight: 700; color: #6ee7b7;">\${correctAnswerText}</span>
                    </div>
                    \` : ''}
                    
                    <div class="review-explanation">
                        <strong style="color: #93c5fd;">Explanation:</strong><br>
                        \${result.explanation}
                    </div>
                </div>
            \`;
        }).join('');

        document.getElementById('reviewContainer').innerHTML = reviewHTML;
    }

    function restartExam() {
        document.getElementById('resultsScreen').classList.add('hidden');
        document.getElementById('startScreen').classList.remove('hidden');
        updateStatsDisplay();
    }

    document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('fileInput').addEventListener('change', handleFileImport);
        document.getElementById('downloadBtn').addEventListener('click', function () {
            window.open('https://drive.google.com/drive/folders/1wMtowPdVQDGkT1QXsyH3IOQrD4YU8qf4?usp=sharing', '_blank');
        });
        document.getElementById('startExamBtn').addEventListener('click', startExam);
        document.getElementById('prevBtn').addEventListener('click', previousQuestion);
        document.getElementById('nextBtn').addEventListener('click', nextQuestion);
        document.getElementById('submitBtn').addEventListener('click', submitExam);
        document.getElementById('restartBtn').addEventListener('click', restartExam);
    });
</script>
</body>
</html>
